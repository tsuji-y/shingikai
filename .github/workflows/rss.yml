name: MOD RSS Poll & Watchdog

on:
  workflow_dispatch:
  schedule:
    # 19:37 JST (10:37 UTC) — 告知は 18〜19 時台に出ることが多く、毎時 0 分を避ける
    - cron: "37 10 * * *"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: mod-rss
  cancel-in-progress: false

jobs:
  poll-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll RSS feeds (MOD & Digital Agency)
        run: |
          python3 mod/poll_rss.py --agency mod
          python3 mod/poll_rss.py --agency digital

      - name: Commit and push rss_items.csv if changed
        run: |
          if git diff --quiet -- data/mod/rss_items.csv data/digital/rss_items.csv && \
             [ -z "$(git ls-files --others --exclude-standard -- data/mod/rss_items.csv data/digital/rss_items.csv)" ]; then
            echo "No RSS updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mod/rss_items.csv data/digital/rss_items.csv
          git commit -m "Update RSS items ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Check for stale council page announcements (>= 3 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 mod/events.py --check-stale-rss --grace-days 3 --markdown > stale_rss.md
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "No stale council pages."
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            echo "Watchdog failed with exit code $rc" >&2
            exit "$rc"
          fi
          cat stale_rss.md >> "$GITHUB_STEP_SUMMARY"
          TITLE="[監視] RSS 告知から 3 日以上未取り込みの審議会ページがあります"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file stale_rss.md
          else
            gh issue create --title "$TITLE" --body-file stale_rss.md
          fi

      - name: Check HTML update workflow liveness (7 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_OK=$(gh run list --workflow update.yml --status success -L 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$LAST_OK" ]; then
            echo "update.yml has no completed successful run yet (skipping liveness alert until first run)."
            exit 0
          fi
          IS_STALE=$(python3 -c 'import sys; from datetime import datetime, timezone, timedelta; last = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print("1" if datetime.now(timezone.utc) - last >= timedelta(days=7) else "0")' "$LAST_OK")
          if [ "$IS_STALE" = "0" ]; then
            echo "update.yml liveness OK (last success: $LAST_OK)"
            exit 0
          fi
          TITLE="[監視] HTML の更新チェックが 7 日以上成功していません"
          BODY="直近の \`update.yml\` 成功日時: \`${LAST_OK}\`（7 日以上前）。Actions のログを確認してください。"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
