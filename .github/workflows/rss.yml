name: MOD RSS Poll & Watchdog

on:
  workflow_dispatch:
  schedule:
    # 19:37 JST (10:37 UTC) — 告知は 18〜19 時台に出ることが多く、毎時 0 分を避ける
    - cron: "37 10 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: mod-rss
  cancel-in-progress: false

jobs:
  poll-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll MOD RSS feeds
        run: python3 mod/poll_rss.py

      - name: Commit and push rss_items.csv if changed
        run: |
          if git diff --quiet -- data/mod/rss_items.csv; then
            echo "No RSS updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mod/rss_items.csv
          git commit -m "Update MOD RSS items ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Check for stale council page announcements (>= 3 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 mod/events.py --check-stale-rss --grace-days 3 --markdown > stale_rss.md
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "No stale council pages."
            exit 0
          fi
          if [ "$rc" -ne 2 ]; then
            echo "Watchdog failed with exit code $rc" >&2
            exit "$rc"
          fi
          cat stale_rss.md >> "$GITHUB_STEP_SUMMARY"
          TITLE="[監視] RSS 告知から 3 日以上未取り込みの審議会ページがあります"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file stale_rss.md
          else
            gh issue create --title "$TITLE" --body-file stale_rss.md
          fi
