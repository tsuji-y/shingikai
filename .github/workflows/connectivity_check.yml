name: Connectivity Check (Phase 0)

on:
  workflow_dispatch:
  schedule:
    # 07:17 JST (22:17 UTC) — 毎時 0 分を避ける
    - cron: "17 22 * * *"

permissions:
  contents: read

concurrency:
  group: connectivity-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Probe www.mod.go.jp (HTML, PDF, RSS)
        run: |
          python3 mod/check_access.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
