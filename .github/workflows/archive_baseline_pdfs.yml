name: Archive Baseline PDFs to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      agency:
        description: "対象の省庁 ID（all なら全収録省庁、個別指定なら mod / digital / cfa 等）"
        required: false
        default: "mod"
      tag:
        description: "作成・アップロード先の Release タグ（省略時は <agency>-pdfs-YYYY-baseline）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: shingikai-archive-baseline-pdfs
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch missing PDF originals and bundle to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ inputs.agency }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            AGENCIES=$(python3 -c 'import json; print(" ".join(json.load(open("agencies.json")).keys()))')
          else
            AGENCIES="$TARGET"
          fi

          # 1 ドメイン 1 プロセス（2 秒間隔直列）を守りつつ、未アーカイブ PDF を最大 6 省庁並列で再取得
          running=0
          for ag in $AGENCIES; do
            if [ ! -f "raw/${ag}/files.csv" ]; then
              continue
            fi
            python3 mod/fetch_files.py --agency "$ag" --refetch-missing --only-unarchived &
            running=$((running + 1))
            if [ "$running" -ge 6 ]; then
              wait -n || true
              running=$((running - 1))
            fi
          done
          wait

          for ag in $AGENCIES; do
            if [ ! -f "raw/${ag}/files.csv" ]; then
              continue
            fi
            TAG_ARGS=(--agency "$ag" --bundle)
            if [ -n "${{ inputs.tag }}" ] && [ "$TARGET" != "all" ]; then
              TAG_ARGS+=(--tag "${{ inputs.tag }}")
            fi
            python3 mod/archive_pdfs.py "${TAG_ARGS[@]}"
          done

      - name: Commit and push updated raw/*/files.csv
        run: |
          if git diff --quiet -- raw/*/files.csv; then
            echo "No changes to raw/*/files.csv."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/*/files.csv
          git commit -m "Record baseline PDF release URLs (${{ inputs.agency || 'mod' }})"
          git pull --rebase
          git push
