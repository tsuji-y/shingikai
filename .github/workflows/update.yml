name: Council Database Daily Update

on:
  workflow_dispatch:
    inputs:
      agency:
        description: "対象の省庁 ID（all なら全収録省庁、個別指定なら mod / digital / cfa 等）"
        required: false
        default: "all"
      council:
        description: "特定の会議体 ID に絞る場合のみ指定（空なら全件）"
        required: false
        default: ""
      dry_run:
        description: "dry-run（ファイル変更・commit・Issue 作成・LLM 呼び出しをしない）"
        type: boolean
        required: false
        default: false
      check_pdf_updates:
        description: "取得済み PDF の差し替え照合も実施する"
        type: boolean
        required: false
        default: false
      no_llm:
        description: "Gemini の後処理をスキップする"
        type: boolean
        required: false
        default: false
  schedule:
    # 07:17 JST (22:17 UTC) — 毎時 0 分を避ける
    - cron: "17 22 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: shingikai-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PDF extraction dependency
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run multi-agency update
        id: run_update
        run: |
          RUN_STARTED="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "started=$RUN_STARTED" >> "$GITHUB_OUTPUT"
          rm -f /tmp/update_summary*.md

          TARGET_AGENCY="${{ inputs.agency }}"
          if [ -z "$TARGET_AGENCY" ] || [ "$TARGET_AGENCY" = "all" ]; then
            AGENCIES=$(python3 -c 'import json; print(" ".join(json.load(open("agencies.json")).keys()))')
          else
            AGENCIES="$TARGET_AGENCY"
          fi

          COMMON_ARGS=(--no-llm)
          if [ -n "${{ inputs.council }}" ]; then
            COMMON_ARGS+=(--council "${{ inputs.council }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            COMMON_ARGS+=(--dry-run)
          fi
          DOW_JST="$(TZ=Asia/Tokyo date +%u)"
          if [ "${{ inputs.check_pdf_updates }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW_JST" = "7" ]; }; then
            COMMON_ARGS+=(--check-pdf-updates)
          fi

          # 省庁ごとにドメインが完全に独立しているため、1 ドメイン 1 プロセス（2 秒間隔直列）を守りつつ
          # 全 16 省庁を並列に更新チェックする
          running=0
          failed=0
          for ag in $AGENCIES; do
            if [ ! -f "raw/${ag}/pages.csv" ]; then
              continue
            fi
            (
              EXTRA_ARGS=()
              if [ "$ag" != "mod" ]; then
                EXTRA_ARGS+=(--tier-mode top_and_recent --pdf-types "議事録,議事要旨,名簿" --max-pdfs 15)
              fi
              python3 mod/update.py --agency "$ag" "${COMMON_ARGS[@]}" "${EXTRA_ARGS[@]}" \
                --summary-out "/tmp/update_summary_${ag}.md"
            ) &
            running=$((running + 1))
            if [ "$running" -ge 16 ]; then
              wait -n || failed=1
              running=$((running - 1))
            fi
          done
          wait || failed=1

          for f in /tmp/update_summary_*.md; do
            if [ -s "$f" ]; then
              ag_name="$(basename "$f" .md)"
              ag_name="${ag_name#update_summary_}"
              echo "# [${ag_name}]" >> /tmp/update_summary.md
              cat "$f" >> /tmp/update_summary.md
              echo "" >> /tmp/update_summary.md
            fi
          done

          if [ "${{ inputs.dry_run }}" != "true" ]; then
            python3 mod/cross_agency.py
          else
            python3 mod/cross_agency.py --dry-run
          fi

          if [ "$failed" -ne 0 ] && [ "$TARGET_AGENCY" != "all" ] && [ -n "$TARGET_AGENCY" ]; then
            exit 1
          fi

      - name: Archive newly fetched PDF originals to GitHub Releases
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_AGENCY="${{ inputs.agency }}"
          if [ -z "$TARGET_AGENCY" ] || [ "$TARGET_AGENCY" = "all" ]; then
            AGENCIES=$(python3 -c 'import json; print(" ".join(json.load(open("agencies.json")).keys()))')
          else
            AGENCIES="$TARGET_AGENCY"
          fi
          for ag in $AGENCIES; do
            if [ -f "raw/${ag}/files.csv" ]; then
              python3 mod/archive_pdfs.py --agency "$ag"
            fi
          done

      - name: Commit and push database updates if any
        if: inputs.dry_run != true
        run: |
          # RSS ジョブと競合しないよう data/*/rss_items.csv は触らない
          if git diff --quiet -- raw/ data/ ':(exclude)data/*/rss_items.csv' && \
             [ -z "$(git ls-files --others --exclude-standard -- raw/ data/ ':(exclude)data/*/rss_items.csv')" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/ data/
          git reset -- 'data/*/rss_items.csv' || true
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Update council database ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Create notification issue if events or new warnings occurred
        id: notify
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/update_summary.md ]; then
            echo "No events or new warnings."
            exit 0
          fi
          cat /tmp/update_summary.md >> "$GITHUB_STEP_SUMMARY"
          TODAY="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          ISSUE_URL=$(gh issue create \
            --title "[更新] 省庁審議会データベースの更新（${TODAY}）" \
            --body-file /tmp/update_summary.md)
          ISSUE_NUM="${ISSUE_URL##*/}"
          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Run Phase 3 Gemini post-processing (separate step & commit)
        if: inputs.dry_run != true && inputs.no_llm != true
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_STARTED: ${{ steps.run_update.outputs.started }}
          ISSUE_NUM: ${{ steps.notify.outputs.issue_number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set; skipping Gemini step."
            exit 0
          fi
          pip install -r requirements-llm.txt
          LLM_ARGS=(--task all --events-since "$RUN_STARTED" --max-llm-calls 20 --review-out /tmp/review_memo.md)
          if [ -n "${{ inputs.council }}" ]; then
            LLM_ARGS+=(--council "${{ inputs.council }}")
          fi
          python3 -m mod.llm.run "${LLM_ARGS[@]}"

          # Gemini の出力があれば本体更新とは別の commit にする
          if ! git diff --quiet -- data/mod/ ':(exclude)data/mod/rss_items.csv' || \
             [ -n "$(git ls-files --others --exclude-standard -- data/mod/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/mod/
            git reset -- data/mod/rss_items.csv || true
            if ! git diff --cached --quiet; then
              git commit -m "Update Gemini summaries and extractions ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
              git pull --rebase
              git push
            fi
          fi

          # 変更の検討メモは通知 Issue のコメントとして投稿（表には入れない）
          if [ -n "$ISSUE_NUM" ] && [ -s /tmp/review_memo.md ]; then
            gh issue comment "$ISSUE_NUM" --body-file /tmp/review_memo.md
          fi
